# podman-compose.yaml
# Root compose file for local development - runs both front-end and back-end together
version: "3.9"

x-image-config: &image-config
    REGISTRY: ${REGISTRY:-localhost}
    BACKEND_IMAGE: ${BACKEND_IMAGE:-poopyfeed-be}
    FRONTEND_IMAGE: ${FRONTEND_IMAGE:-poopyfeed-fe}
    IMAGE_TAG: ${IMAGE_TAG:-dev}

x-resource-limits: &resource-limits
  resources:
    limits:
      cpus: "1"
      memory: 512M
    reservations:
      cpus: "0.5"
      memory: 256M

x-frontend-resource-limits: &frontend-resource-limits
  resources:
    limits:
      cpus: "0.5"
      memory: 256M
    reservations:
      cpus: "0.25"
      memory: 128M

x-db-resource-limits: &db-resource-limits
  resources:
    limits:
      cpus: "1"
      memory: 1G
    reservations:
      cpus: "0.5"
      memory: 512M

services:
    # Redis cache & session store
    redis:
        image: docker.io/redis:7-alpine
        container_name: poopyfeed-redis
        command: redis-server --appendonly yes --appendfsync everysec
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        networks:
            - poopyfeed-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3
        <<: *frontend-resource-limits

    # PostgreSQL database
    db:
        image: docker.io/postgres:${POSTGRES_VERSION:-14}
        container_name: poopyfeed-db
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - "POSTGRES_HOST_AUTH_METHOD=trust"
        networks:
            - poopyfeed-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        <<: *db-resource-limits

    # Django back-end
    backend:
        image: ${REGISTRY:-localhost}/${BACKEND_IMAGE:-poopyfeed-be}:${IMAGE_TAG:-dev}
        container_name: poopyfeed-backend
        build:
            context: ./back-end
            dockerfile: Containerfile
            target: development
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./back-end:/code
        ports:
            - "8000:8000"
        environment:
            - "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-dev-only}"
            - "DJANGO_DEBUG=True"
            - "RELAX_E2E_THROTTLES=1"
            - "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend"
            - "DJANGO_SECURE_SSL_REDIRECT=False"
            - "DJANGO_SECURE_HSTS_SECONDS=0"
            - "DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=False"
            - "DJANGO_SECURE_HSTS_PRELOAD=False"
            - "DJANGO_SESSION_COOKIE_SECURE=False"
            - "DJANGO_CSRF_COOKIE_SECURE=False"
            - "DATABASE_HOST=db"
            - "DATABASE_NAME=postgres"
            - "DATABASE_USER=postgres"
            - "DATABASE_PASSWORD="
            - "REDIS_HOST=redis"
            - "REDIS_PORT=6379"
            - "CELERY_BROKER_URL=redis://redis:6379/0"
            - "CELERY_RESULT_BACKEND=redis://redis:6379/1"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - poopyfeed-network
        <<: *resource-limits

    # Celery worker for async tasks (PDF generation, etc.)
    celery-worker:
        image: ${REGISTRY:-localhost}/${BACKEND_IMAGE:-poopyfeed-be}:${IMAGE_TAG:-dev}
        container_name: poopyfeed-celery-worker
        build:
            context: ./back-end
            dockerfile: Containerfile
            target: development
        command: celery -A django_project worker -l info
        volumes:
            - ./back-end:/code
            - ./back-end/exports:/code/exports
        environment:
            - "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-dev-only}"
            - "DJANGO_DEBUG=True"
            - "DATABASE_HOST=db"
            - "DATABASE_NAME=postgres"
            - "DATABASE_USER=postgres"
            - "DATABASE_PASSWORD="
            - "REDIS_HOST=redis"
            - "REDIS_PORT=6379"
            - "CELERY_BROKER_URL=redis://redis:6379/0"
            - "CELERY_RESULT_BACKEND=redis://redis:6379/1"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            backend:
                condition: service_healthy
        networks:
            - poopyfeed-network
        <<: *resource-limits

    # Angular front-end
    frontend:
        image: ${REGISTRY:-localhost}/${FRONTEND_IMAGE:-poopyfeed-fe}:${IMAGE_TAG:-dev}
        container_name: poopyfeed-frontend
        build:
            context: ./front-end
            dockerfile: Containerfile
            target: development
        command: npm start -- --host 0.0.0.0
        volumes:
            - ./front-end/poopyfeed:/app
            - /app/node_modules
        ports:
            - "4200:4200"
        environment:
            - "NODE_ENV=development"
            - "API_URL=http://backend:8000" # Internal network URL
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - poopyfeed-network
        <<: *frontend-resource-limits

    # Android build toolchain (on-demand, not started with `make run`)
    android:
        image: ${REGISTRY:-localhost}/${ANDROID_IMAGE:-poopyfeed-android}:${IMAGE_TAG:-dev}
        container_name: poopyfeed-android
        build:
            context: ./android
            dockerfile: Containerfile
        profiles:
            - android
        networks:
            - poopyfeed-network
        <<: *resource-limits

networks:
    poopyfeed-network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
