# podman-compose.yaml
# Root compose file for local development - runs both front-end and back-end together
version: "3.9"

x-image-config: &image-config
    REGISTRY: ${REGISTRY:-localhost}
    BACKEND_IMAGE: ${BACKEND_IMAGE:-poopyfeed-be}
    FRONTEND_IMAGE: ${FRONTEND_IMAGE:-poopyfeed-fe}
    IMAGE_TAG: ${IMAGE_TAG:-latest}

services:
    # Redis cache & session store
    redis:
        image: docker.io/redis:7-alpine
        container_name: poopyfeed-redis
        command: redis-server --appendonly yes --appendfsync everysec
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        networks:
            - poopyfeed-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3

    # PostgreSQL database
    db:
        image: docker.io/postgres:${POSTGRES_VERSION:-14}
        container_name: poopyfeed-db
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - "POSTGRES_HOST_AUTH_METHOD=trust"
        networks:
            - poopyfeed-network

    # Django back-end
    backend:
        image: ${REGISTRY:-localhost}/${BACKEND_IMAGE:-poopyfeed-be}:${IMAGE_TAG:-latest}
        container_name: poopyfeed-backend
        build:
            context: ./back-end
            dockerfile: Containerfile
        command: python /code/manage.py runserver 0.0.0.0:8000
        volumes:
            - ./back-end:/code
        ports:
            - "8000:8000"
        environment:
            - "DJANGO_SECRET_KEY=change-this-key" # nosec B105
            - "DJANGO_DEBUG=True"
            - "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend"
            - "DJANGO_SECURE_SSL_REDIRECT=False"
            - "DJANGO_SECURE_HSTS_SECONDS=0"
            - "DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=False"
            - "DJANGO_SECURE_HSTS_PRELOAD=False"
            - "DJANGO_SESSION_COOKIE_SECURE=False"
            - "DJANGO_CSRF_COOKIE_SECURE=False"
            - "DATABASE_HOST=db"
            - "DATABASE_NAME=postgres"
            - "DATABASE_USER=postgres"
            - "DATABASE_PASSWORD="
            - "REDIS_HOST=redis"
            - "REDIS_PORT=6379"
            - "CELERY_BROKER_URL=redis://redis:6379/0"
            - "CELERY_RESULT_BACKEND=redis://redis:6379/1"
        depends_on:
            - db
            - redis
        networks:
            - poopyfeed-network

    # Celery worker for async tasks (PDF generation, etc.)
    celery-worker:
        image: ${REGISTRY:-localhost}/${BACKEND_IMAGE:-poopyfeed-be}:${IMAGE_TAG:-latest}
        container_name: poopyfeed-celery-worker
        build:
            context: ./back-end
            dockerfile: Containerfile
        command: celery -A django_project worker -l info
        volumes:
            - ./back-end:/code
            - ./back-end/exports:/code/exports
        environment:
            - "DJANGO_SECRET_KEY=change-this-key" # nosec B105
            - "DJANGO_DEBUG=True"
            - "DATABASE_HOST=db"
            - "DATABASE_NAME=postgres"
            - "DATABASE_USER=postgres"
            - "DATABASE_PASSWORD="
            - "REDIS_HOST=redis"
            - "REDIS_PORT=6379"
            - "CELERY_BROKER_URL=redis://redis:6379/0"
            - "CELERY_RESULT_BACKEND=redis://redis:6379/1"
        depends_on:
            - db
            - redis
            - backend
        networks:
            - poopyfeed-network

    # Angular front-end
    frontend:
        image: ${REGISTRY:-localhost}/${FRONTEND_IMAGE:-poopyfeed-fe}:${IMAGE_TAG:-latest}
        container_name: poopyfeed-frontend
        build:
            context: ./front-end
            dockerfile: Containerfile
            target: development
        command: npm start -- --host 0.0.0.0
        volumes:
            - ./front-end/poopyfeed:/app
            - /app/node_modules
        ports:
            - "4200:4200"
        environment:
            - "NODE_ENV=development"
            - "API_URL=http://backend:8000" # Internal network URL
        depends_on:
            - backend
        networks:
            - poopyfeed-network

    # E2E tests (run with: make test-e2e)
    e2e:
        build:
            context: .
            dockerfile: Containerfile.e2e
        container_name: poopyfeed-e2e
        environment:
            - "BASE_URL=http://frontend:4200"
            - "CI=1"
        depends_on:
            - frontend
        networks:
            - poopyfeed-network
        ipc: host
        init: true

    # Android build toolchain (on-demand, not started with `make run`)
    android:
        image: ${REGISTRY:-localhost}/${ANDROID_IMAGE:-poopyfeed-android}:${IMAGE_TAG:-latest}
        container_name: poopyfeed-android
        build:
            context: ./android
            dockerfile: Containerfile
        profiles:
            - android
        networks:
            - poopyfeed-network

networks:
    poopyfeed-network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
